<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lupa Kata Sandi – Ruang Aman</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script type="module" src="js/auth.js"></script>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
<div class="auth-container">
  <div class="auth-side">
    <div class="auth-side-content">
      <a href="/" class="auth-brand"><i class="fas fa-shield-alt"></i> Ruang Aman</a>
      <h2 class="auth-side-title">Tenang, kami bantu. <span>Akunmu aman.</span></h2>
      <p class="auth-side-desc">Masukkan email yang terdaftar. Kami akan mengirimkan tautan untuk mengatur ulang kata sandi Anda.</p>
    </div>
    <div class="auth-leaf auth-leaf-1"><i class="fas fa-leaf"></i></div>
    <div class="auth-leaf auth-leaf-2"><i class="fas fa-leaf"></i></div>
    <div class="auth-leaf auth-leaf-3"><i class="fas fa-leaf"></i></div>
  </div>
  <div class="auth-form-side">
    <div class="auth-form-wrapper">
      <div class="auth-form-header">
        <h1>Lupa Kata Sandi?</h1>
        <p>Masukkan email Anda untuk menerima tautan reset</p>
      </div>
      <form class="auth-form">
        <div class="form-group">
          <label for="email">Email Terdaftar</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope"></i>
            <input type="email" id="email" placeholder="nama@email.com" required />
          </div>
        </div>
        <button type="submit" class="btn-auth btn-auth-primary"><i class="fas fa-paper-plane"></i> Kirim Tautan Reset</button>
      </form>
      <div class="auth-footer"><a href="/login.html">← Kembali ke Halaman Masuk</a></div>
    </div>
  </div>
</div>
</body>
</html>
