<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atur Kata Sandi Baru – Ruang Aman</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <script type="module" src="js/auth.js?v=3"></script>
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-side">
      <div class="auth-side-content">
        <a href="/" class="auth-brand"><i class="fas fa-shield-alt"></i> Ruang Aman</a>
        <h2 class="auth-side-title">Buat kata sandi baru. <span>Jaga akunmu tetap aman.</span></h2>
        <p class="auth-side-desc">Gunakan minimal delapan karakter dan hindari kata sandi yang pernah digunakan pada layanan lain.</p>
      </div>
      <div class="auth-leaf auth-leaf-1"><i class="fas fa-leaf"></i></div>
      <div class="auth-leaf auth-leaf-2"><i class="fas fa-leaf"></i></div>
      <div class="auth-leaf auth-leaf-3"><i class="fas fa-leaf"></i></div>
    </div>

    <div class="auth-form-side">
      <div class="auth-form-wrapper">
        <div class="auth-form-header">
          <h1>Atur Kata Sandi Baru</h1>
          <p>Masukkan kata sandi baru untuk akun Anda</p>
        </div>

        <form class="auth-form">
          <div class="form-group">
            <label for="password">Kata Sandi Baru</label>
            <div class="input-wrapper">
              <i class="fas fa-lock"></i>
              <input type="password" id="password" placeholder="Minimal 8 karakter" minlength="8" autocomplete="new-password" required />
              <button type="button" class="toggle-password" onclick="togglePassword('password', this)" aria-label="Tampilkan kata sandi">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="confirm-password">Konfirmasi Kata Sandi</label>
            <div class="input-wrapper">
              <i class="fas fa-lock"></i>
              <input type="password" id="confirm-password" placeholder="Ulangi kata sandi baru" minlength="8" autocomplete="new-password" required />
              <button type="button" class="toggle-password" onclick="togglePassword('confirm-password', this)" aria-label="Tampilkan konfirmasi kata sandi">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-auth btn-auth-primary">
            <i class="fas fa-key"></i> Simpan Kata Sandi
          </button>
        </form>

        <div class="auth-footer">
          <a href="/forgot-password.html">← Minta tautan pemulihan baru</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
